<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC','Heiti TC',sans-serif">
<defs></defs>
<rect width="1200" height="330" fill="#ffffff"/>
<path d="M380,165 C440,165 450,85 520,85" stroke="#78909c" stroke-width="3" fill="none" />
<path d="M380,165 C440,165 450,245 520,245" stroke="#78909c" stroke-width="3" fill="none" />
<rect x="20" y="100" width="360" height="130" rx="16" fill="#3f51b5" stroke="none" stroke-width="2" />
<text font-size="25" font-weight="800" fill="#fff" text-anchor="middle" ><tspan x="200" y="157.5">明顯嘔吐物、排泄物、</tspan><tspan x="200" y="190.5">分泌物、血液</tspan></text>
<rect x="520" y="20" width="660" height="130" rx="16" fill="#e8f5e9" stroke="#43a047" stroke-width="3" />
<text font-size="25" font-weight="800" fill="#2e7d32" text-anchor="middle" ><tspan x="850" y="69.0">小範圍（小於 10 ml）</tspan></text>
<text font-size="24" font-weight="700" fill="#263238" text-anchor="middle" ><tspan x="850" y="118.6">1,000 ppm 漂白水 噴灑覆蓋除汙</tspan></text>
<rect x="520" y="180" width="660" height="130" rx="16" fill="#ffebee" stroke="#e53935" stroke-width="3" />
<text font-size="25" font-weight="800" fill="#c62828" text-anchor="middle" ><tspan x="850" y="229.0">大範圍（10 ml 含以上）</tspan></text>
<text font-size="24" font-weight="700" fill="#263238" text-anchor="middle" ><tspan x="850" y="278.6">5,000 ppm 漂白水擦拭後，再以清潔劑除汙</tspan></text>
</svg>
