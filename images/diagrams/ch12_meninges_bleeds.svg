<text x="780.0" y="436.25" font-size="14" font-weight="700" fill="#263238" text-anchor="middle" ><tspan x="780.0" dy="0">血流入腦脊液</tspan><tspan x="780.0" dy="17.5">積在腦溝、腦池</tspan></text>
