<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC','Heiti TC',sans-serif">
<rect width="900" height="560" fill="#ffffff"/>
<text x="330" y="40" font-size="18" font-weight="800" fill="#455a64" text-anchor="middle" ><tspan x="330" dy="0">左心室短軸切面（像切開的甜甜圈）</tspan></text>
<path d="M180,140 C30,170 30,410 180,440 C125,360 125,220 180,140 Z" fill="#e3f0fc" stroke="#1e88e5" stroke-width="3"/>
