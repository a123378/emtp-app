<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background with squircle -->
  <rect width="512" height="512" rx="115" fill="#e87722"/>
  
  <!-- Inner subtle border -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Star of Life (生命之星 6角交叉棒) or Medical Cross -->
  <g filter="url(#shadow)">
    <!-- Vertical Cross bar -->
    <rect x="224" y="90" width="64" height="230" rx="20" fill="#ffffff"/>
    <!-- Horizontal Cross bar -->
    <rect x="141" y="173" width="230" height="64" rx="20" fill="#ffffff"/>
    
    <!-- Heartbeat EKG Pulse across the cross -->
    <path d="M110 205 L180 205 L198 160 L220 250 L242 135 L264 240 L282 185 L300 205 L402 205" 
          fill="none" stroke="#e87722" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography: EMT-P -->
  <g filter="url(#shadow)">
    <text x="256" y="415" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="82" 
          font-weight="900" 
          letter-spacing="4"
          fill="#ffffff" 
          text-anchor="middle">EMT-P</text>
    <text x="256" y="455" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="24" 
          font-weight="700" 
          letter-spacing="8"
          fill="#fed7aa" 
          text-anchor="middle">臨床精研 ‧ 題庫</text>
  </g>
</svg>
